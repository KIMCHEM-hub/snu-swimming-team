<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서울대학교 수영부 부원 전용 페이지">
  <title>부원 전용 | Seoul National University Swimming Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    :root{--snu-blue:#003380;--snu-blue-deep:#001c47;--snu-gold:#C5A86F;--snu-silver:#B5B6B6;--font-ui:"Pretendard Variable","Pretendard","Noto Sans KR",Arial,sans-serif;--font-body:var(--font-ui)}body{min-height:100vh;background:#f4f5f1;color:#092a5a;font-family:var(--font-ui)}.members-header{background:var(--snu-blue);color:#fff}.members-nav{height:78px;display:flex;align-items:center;justify-content:space-between}.members-brand{font-size:12px;line-height:1.15;letter-spacing:.06em}.members-brand b{display:block;font-size:9px;letter-spacing:.12em}.members-back{font-size:10px;font-weight:700;letter-spacing:.08em}.members-main{width:min(100% - 40px,560px);margin:0 auto;padding:clamp(80px,14vw,140px) 0}.members-eyebrow{margin:0 0 12px;color:var(--snu-gold);font-size:10px;font-weight:700;letter-spacing:.14em}.members-title{margin:0 0 36px;font-size:clamp(2.4rem,7vw,4.4rem);line-height:.92;letter-spacing:-.06em}.members-card{border-top:3px solid var(--snu-blue);background:#fff;padding:clamp(26px,6vw,48px);box-shadow:0 14px 45px rgba(0,28,71,.08)}.members-card h2{margin:0 0 10px;font-size:1.6rem;line-height:1.15;letter-spacing:-.04em}.members-card p{margin:0;color:#666;font-size:14px;line-height:1.65}.members-form{display:grid;gap:18px;margin-top:30px}.members-label{display:grid;gap:8px;color:#092a5a;font-size:10px;font-weight:700;letter-spacing:.09em}.members-input{width:100%;border:1px solid var(--snu-silver);padding:14px;background:#fff;color:#092a5a;font:inherit}.members-input:focus{outline:2px solid var(--snu-gold);outline-offset:2px}.members-button{display:inline-flex;justify-content:center;border:1px solid var(--snu-blue);padding:15px 18px;background:var(--snu-blue);color:#fff;font:inherit;font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer}.members-button:hover{background:var(--snu-blue-deep)}.members-button:disabled{cursor:wait;opacity:.65}.members-status{min-height:1.5em;margin-top:18px;color:#8a6c30;font-size:13px}.members-status[hidden],.members-view[hidden]{display:none}.members-profile{display:grid;gap:20px;margin-top:30px}.members-detail{margin:0;border-top:1px solid var(--snu-silver)}.members-detail div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--snu-silver)}.members-detail dt{font-size:10px;font-weight:700;letter-spacing:.08em}.members-detail dd{margin:0;font-size:15px}.members-logout{margin-top:28px;background:#fff;color:var(--snu-blue)}.members-logout:hover{background:#f4f5f1}@media(max-width:760px){.members-nav{height:68px}.members-main{padding-top:78px}.members-detail div{grid-template-columns:88px 1fr}}
  </style>
</head>
<body>
  <header class="members-header"><nav class="members-nav shell" aria-label="부원 전용 메뉴"><a class="members-brand" href="./index.html">서울대학교 수영부<b>SEOUL NATIONAL UNIVERSITY SWIMMING TEAM</b></a><a class="members-back" href="./index.html">← SITE HOME</a></nav></header>
  <main class="members-main">
    <p class="members-eyebrow">MEMBERS ONLY</p>
    <h1 class="members-title">MEMBER<br>ACCESS.</h1>
    <section class="members-card" aria-live="polite">
      <div class="members-view" data-login-view>
        <h2>부원 로그인</h2><p>등록된 이메일과 비밀번호로 로그인해 주세요.</p>
        <form class="members-form" data-login-form>
          <label class="members-label">EMAIL<input class="members-input" type="email" name="email" autocomplete="email" required></label>
          <label class="members-label">PASSWORD<input class="members-input" type="password" name="password" autocomplete="current-password" required></label>
          <button class="members-button" type="submit">LOG IN</button>
        </form>
      </div>
      <div class="members-view" data-profile-view hidden>
        <h2>로그인되었습니다</h2><p data-member-email></p>
        <div class="members-profile"><dl class="members-detail"><div><dt>NAME</dt><dd data-member-name>—</dd></div><div><dt>ATHLETE ID</dt><dd data-member-athlete-id>—</dd></div></dl></div>
        <button class="members-button members-logout" type="button" data-logout-button>LOG OUT</button>
      </div>
      <p class="members-status" data-auth-status hidden></p>
    </section>
  </main>
  <script type="module" src="./js/members.js"></script>
</body>
</html>
